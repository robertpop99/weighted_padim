name: volcanic-anomaly-detection

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.9
  - pytorch=1.13
  - torchvision=0.14
  - pytorch-cuda=11.6
  - numpy<2
  - scipy
  - pandas
  - matplotlib
  - scikit-image
  - scikit-learn
  - rasterio
  - imageio
  - pillow
  - pyyaml
  - h5py
  - pip

  - pip:
      - timm==0.9.2
      - kornia==0.6.12
      - opencv-python==4.6.0.66
      - huggingface-hub==0.14.1
      # Later versions introduce API changes affecting ROC/AUC imports
      - torchmetrics==0.10.1
